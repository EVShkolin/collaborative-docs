# config/packages/nelmio_api_doc.yaml
nelmio_api_doc:
  documentation:
    info:
      title: Collaborative Docs API
      description: REST API для совместного редактирования документов
      version: 1.0.0
    components:
      securitySchemes:
        Bearer:
          type: http
          scheme: bearer
          bearerFormat: JWT
    security:
      - Bearer: []

    paths:
      /api/v1/auth/login:
        post:
          tags: [ Authentication ]
          summary: Авторизация и получение JWT токена
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    email:
                      type: string
                      example: admin@test.com
                    password:
                      type: string
                      example: 123456
          responses:
            '200':
              description: Успешная авторизация
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      token:
                        type: string
            '401':
              description: Неверные учетные данные

  areas:
    path_patterns:
      - ^/api(?!/doc$)


