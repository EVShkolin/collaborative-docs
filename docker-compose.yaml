services:
  database:
    image: postgres:17
    container_name: database
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: collab_doc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -p 5432" ]
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  pg_data:
